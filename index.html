    <style>
        :root {
            --bg-base: #060b17;
            --bg-surface: #0b1426;
            --bg-surface-elevated: #101c36;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(197, 160, 89, 0.35);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --gold-primary: #c5a059;
            --gold-hover: #d4b26f;
            --gold-subtle: rgba(197, 160, 89, 0.1);
            --font-family: 'Cairo', system-ui, -apple-system, sans-serif;
            --transition-fast: 0.2s ease-in-out;
            --transition-smooth: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            --max-w: 1200px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-base);
            color: var(--text-primary);
            line-height: 1.65;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: var(--max-w);
            margin-inline: auto;
            padding-inline: 1.5rem;
        }

        /* Accessibility: Skip Navigation Link */
        .skip-navigation-link {
            position: absolute;
            top: -100px;
            right: 1.5rem;
            background: var(--gold-primary);
            color: #040813;
            padding: 0.75rem 1.5rem;
            font-weight: 800;
            font-size: 0.9rem;
            border-radius: 0 0 8px 8px;
            z-index: 99999;
            text-decoration: none;
            transition: top var(--transition-fast);
        }

        .skip-navigation-link:focus {
            top: 0;
            outline: 3px solid #ffffff;
            outline-offset: 2px;
        }

        /* Accessibility: Explicit Focus Indicators */
        a:focus-visible,
        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: 2px solid var(--gold-primary) !important;
            outline-offset: 3px !important;
            box-shadow: 0 0 0 4px rgba(197, 160, 89, 0.25) !important;
        }

        /* ================= Header Styles ================= */
        .site-header {
            position: sticky;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(6, 11, 23, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 76px;
        }

        .brand-wrapper {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            text-decoration: none;
        }

        .brand-emblem {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: var(--gold-subtle);
            border: 1.5px solid var(--gold-primary);
            color: var(--gold-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.25rem;
        }

        .brand-meta {
            display: flex;
            flex-direction: column;
        }

        .brand-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .brand-role {
            font-size: 0.75rem;
            color: var(--gold-primary);
            font-weight: 600;
        }

        .nav-menu {
            display: none;
            gap: 2rem;
            list-style: none;
        }

        @media (min-width: 960px) {
            .nav-menu { display: flex; }
        }

        .nav-item-link {
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 600;
            transition: color var(--transition-fast);
        }

        .nav-item-link:hover {
            color: var(--gold-primary);
        }

        .header-cta-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        /* Buttons Core */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 0.7rem 1.4rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            font-family: inherit;
            text-decoration: none;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all var(--transition-fast);
            min-height: 46px;
            min-width: 44px;
        }

        .btn-gold {
            background-color: var(--gold-primary);
            color: #040813;
        }

        .btn-gold:hover {
            background-color: var(--gold-hover);
            transform: translateY(-1px);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-primary);
            border-color: var(--border-subtle);
        }

        .btn-outline:hover {
            border-color: var(--gold-primary);
            background: var(--gold-subtle);
            color: var(--gold-hover);
        }

        .menu-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            background: transparent;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
        }

        @media (min-width: 960px) {
            .menu-toggle { display: none; }
        }

        /* Accessible Mobile Drawer */
        .mobile-menu {
            position: fixed;
            inset: 0;
            background: rgba(6, 11, 23, 0.98);
            backdrop-filter: blur(15px);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 1.75rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--transition-smooth);
        }

        .mobile-menu.active {
            opacity: 1;
            pointer-events: auto;
        }

        .mobile-close-btn {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            background: transparent;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mobile-link {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
        }

        .mobile-link:hover {
            color: var(--gold-primary);
        }

        /* ================= Hero Section ================= */
        .hero-section {
            padding: 4.5rem 0 5.5rem;
            position: relative;
        }

        .hero-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 3.5rem;
            align-items: center;
        }

        @media (min-width: 992px) {
            .hero-layout {
                grid-template-columns: 1.25fr 0.95fr;
            }
        }

        .hero-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.35rem 0.9rem;
            background: var(--gold-subtle);
            border: 1px solid var(--border-strong);
            border-radius: 6px;
            color: var(--gold-primary);
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .hero-main-heading {
            font-size: 2.25rem;
            font-weight: 900;
            line-height: 1.3;
            letter-spacing: -0.03em;
            color: #ffffff;
            margin-bottom: 1.25rem;
        }

        @media (min-width: 768px) {
            .hero-main-heading {
                font-size: 3.1rem;
            }
        }

        .hero-description {
            font-size: 1.05rem;
            color: var(--text-secondary);
            line-height: 1.75;
            margin-bottom: 2.25rem;
            max-width: 620px;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .hero-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 2.25rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .hero-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100px;
            height: 2px;
            background: linear-gradient(to left, var(--gold-primary), transparent);
        }

        .card-header-label {
            font-size: 0.78rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--gold-primary);
            margin-bottom: 1.5rem;
            display: block;
        }

        .pillar-stack {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            list-style: none;
        }

        .pillar-row {
            display: flex;
            gap: 1rem;
            align-items: flex-start;
        }

        .pillar-symbol {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--bg-surface-elevated);
            border: 1px solid var(--border-subtle);
            color: var(--gold-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .pillar-info h3 {
            font-size: 0.98rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }

        .pillar-info p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* ================= Sections General ================= */
        .section-heading-wrapper {
            text-align: center;
            max-width: 720px;
            margin: 0 auto 4rem;
        }

        .section-eyebrow {
            display: inline-block;
            color: var(--gold-primary);
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 0.75rem;
        }

        .section-main-title {
            font-size: 1.85rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            line-height: 1.35;
            margin-bottom: 1rem;
        }

        @media (min-width: 768px) {
            .section-main-title {
                font-size: 2.2rem;
            }
        }

        .section-lead-text {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        /* ================= Services Section ================= */
        .services-section {
            padding: 6rem 0;
            border-top: 1px solid var(--border-subtle);
            background-color: var(--bg-base);
        }

        .services-matrix-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.75rem;
        }

        @media (min-width: 680px) {
            .services-matrix-grid {
                grid-template-columns
